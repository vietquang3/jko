name: BoxController
options:
  bundleIdPrefix: com.boxcontroller
  deploymentTarget:
    iOS: "14.0"
targets:
  BoxController:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Box Controller
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocalNetworkUsageDescription: Gửi dữ liệu cảm biến chuyển động tới máy tính trong mạng Wi-Fi để điều khiển game.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.boxcontroller.app
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
